name: Build & Notify

on:
  push:
    branches: [main, dev]
    paths-ignore: &non_code_paths
      - "**/*.md"
      - "assets/**"
      - "screenshots/**"
      - "LICENSE"
      - ".github/ISSUE_TEMPLATE/**"
      - ".github/PULL_REQUEST_TEMPLATE.md"
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  notify-telegram:
    name: Notify Telegram
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install dependencies
        run: pip install requests

      - name: Send build notification
        env:
          BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TOPIC_ID: ${{ secrets.TELEGRAM_TOPIC_ID }}
        run: python ./.github/workflows/notify_telegram.py
        continue-on-error: true

  build:
    name: Lint, test & debug build
    runs-on: ubuntu-latest
    needs: notify-telegram
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Make Gradle executable
        run: chmod +x ./gradlew

      - name: Run lint, tests, and debug build
        run: ./gradlew --no-daemon --stacktrace lintDebug testDebugUnitTest assembleDebug assembleRelease

      - name: Upload lint reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: lint-reports
          path: app/build/reports/lint-results-*.html
          if-no-files-found: warn
          retention-days: 14

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: SmartIsland-Debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      # The one to install: R8-optimised, not debuggable, with the baseline profile (a debug build runs Compose
      # far slower, so the island's animations stutter). Signed with the fork's fixed key.
      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: SmartIsland-Release-apk
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 14

  # Fork: every main build is published as a GitHub Release, so the newest APK is one plain link (no zip, no sign-in):
  # https://github.com/<owner>/<repo>/releases/latest/download/SmartIsland.apk
  publish-release:
    name: Publish release APK
    runs-on: ubuntu-latest
    needs: build
    if: ${{ github.ref == 'refs/heads/main' }}
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      KEEP_RELEASES: 5

    steps:
      - name: Download release APK
        uses: actions/download-artifact@v4
        with:
          name: SmartIsland-Release-apk

      - name: Create release
        run: |
          TAG="build-${GITHUB_RUN_NUMBER}"
          mv app-release.apk SmartIsland.apk
          SUBJECT="$(gh api "repos/$GH_REPO/commits/$GITHUB_SHA" --jq '.commit.message | split("\n")[0]')"
          gh release create "$TAG" SmartIsland.apk \
            --target "$GITHUB_SHA" \
            --title "Build ${GITHUB_RUN_NUMBER} (${GITHUB_SHA::7})" \
            --notes "$SUBJECT" \
            --latest

      - name: Keep only the newest builds
        run: |
          gh release list --limit 100 --json tagName,createdAt \
            --jq '[.[] | select(.tagName | startswith("build-"))] | sort_by(.createdAt) | reverse | .[env.KEEP_RELEASES | tonumber:] | .[].tagName' |
            while read -r old; do
              gh release delete "$old" --yes --cleanup-tag
            done

  send-apk:
    name: Forward debug APK to Telegram
    runs-on: ubuntu-latest
    needs: build
    if: ${{ github.ref == 'refs/heads/dev' || github.event_name == 'workflow_dispatch' }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Download debug APK
        uses: actions/download-artifact@v4
        with:
          name: SmartIsland-Debug-apk

      - name: Send to Telegram
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_TOPIC_ID: ${{ secrets.TELEGRAM_TOPIC_ID }}
          TELEGRAM_DEBUG_TOPIC_ID: ${{ secrets.TELEGRAM_DEBUG_TOPIC_ID }}
        run: |
          chmod +x ./scripts/send-telegram.sh
          ./scripts/send-telegram.sh "app-debug.apk" "Debug"
